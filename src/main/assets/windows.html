function clock(){
 var d=new Date(),p=function(n){return (n<10?'0':'')+n};
 $('cl').innerHTML=p(d.getHours())+'.'+p(d.getMinutes())+'<br>'+p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()}

/* ---------- wallpaper ---------- */
function wall(){
 var b=$('wb'),v=$('wv'),u=LS.g('wp',0);if(v)v.remove();
 if(u){b.className='';b.style.cssText='background-image:url('+u+');background-size:cover;background-position:center';$('wl').style.display='none'}
 else{b.className='d';b.style.cssText='';$('wl').style.display=''}}
$('ff').onchange=function(){
 var f=this.files&&this.files[0];if(!f)return;this.value='';show(null);
 if(/^video/.test(f.type)){
  wall();var v=mk('video');v.id='wv';v.src=URL.createObjectURL(f);v.autoplay=true;v.loop=true;v.muted=true;v.setAttribute('playsinline','');
  $('wb').className='';$('wl').style.display='none';$('wm').appendChild(v);LS.s('wp',0)}
 else{
  var im=new Image(),u=URL.createObjectURL(f);
  im.onload=function(){
   var s=Math.min(1,1600/Math.max(im.width,im.height)),cv=mk('canvas');cv.width=im.width*s;cv.height=im.height*s;
   cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);LS.s('wp',cv.toDataURL('image/jpeg',.85));URL.revokeObjectURL(u);wall()};
  im.src=u}};

/* ---------- pengaturan desktop ---------- */
var tab=0,T=[['Personalisasi',pPers],['Desktop',pDesk],['Taskbar',pTask],['Tentang',pAbout]];
function openFs(){rFs();show('fs')}
function rFs(){
 var n=$('fn'),c=$('fc');n.innerHTML='';c.innerHTML='';
 T.forEach(function(t,i){var b=mk('button',i===tab?'on':null,t[0]);b.onclick=function(){tab=i;rFs()};n.appendChild(b)});
 var x=mk('button','x','Tutup');x.onclick=function(){show(null)};n.appendChild(x);T[tab][1](c)}
function row(l,ctl,c){var r=mk('div','fr'),s=mk('span');s.textContent=l;r.appendChild(s);[].concat(ctl).forEach(function(x){r.appendChild(x)});c.appendChild(r)}
function tog(k){var b=mk('button','fb',S[k]?'Aktif':'Mati');b.onclick=function(){S[k]=S[k]?0:1;b.textContent=S[k]?'Aktif':'Mati';ap();save()};return b}
function rng(k,a,b,s){var i=mk('input');i.type='range';i.min=a;i.max=b;i.step=s;i.value=S[k];i.oninput=function(){S[k]=+i.value;ap()};i.onchange=save;return i}
function pPers(c){
 var f=mk('button','fb','Pilih file'),d=mk('button','fb','Bawaan'),sw=mk('span');
 f.onclick=function(){$('ff').click()};d.onclick=function(){LS.s('wp',0);wall()};row('Wallpaper (gambar / video)',[f,d],c);
 row('Pas di layar (tidak dipotong)',tog('fit'),c);row('Gelapkan wallpaper',rng('dim',0,.8,.05),c);row('Animasi wallpaper bawaan',tog('an'),c);
 ACC.forEach(function(a,i){var s=mk('button','sw'+(S.ac===i?' on':''));s.style.background='linear-gradient(135deg,'+a[0]+','+a[1]+')';s.onclick=function(){S.ac=i;ap();save();rFs()};sw.appendChild(s)});
 row('Warna aksen',sw,c);row('Gaya Windows 11',tog('w11'),c)}
function pDesk(c){
 var x=mk('button','fb','Hapus semua');x.onclick=function(){S.desk=[];save();rDesk()};
 row('Ukuran ikon',rng('is',.7,1.6,.1),c);row('Tampilkan nama ikon',tog('lab'),c);row('Tombol “Tambah” di desktop',tog('add'),c);row('Ikon di desktop',x,c)}
function pTask(c){
 row('Transparansi taskbar',rng('tbo',.3,1,.02),c);row('Ikon taskbar rata kiri',tog('tl'),c);row('Ikon status (Wi‑Fi, data, baterai)',tog('st'),c);
 row('Persen baterai',tog('bp'),c);row('Rekomendasi di menu Mulai',tog('rc'),c)}
function pAbout(c){
 var u=mk('input'),r=mk('button','fb','Reset'),ok=0;u.type='text';u.value=S.un;u.onchange=function(){S.un=u.value.trim()||'HyperDesk';ap();save()};
 r.onclick=function(){if(!ok){ok=1;r.textContent='Ketuk lagi';return}S=dflt();save();LS.s('wp',0);ap();wall();rDesk();rStart();rFs()};
 row('Nama pengguna',u,c);row('Atur ulang semua pengaturan',r,c);c.appendChild(mk('div','nb','HyperDesk 1.0 — antarmuka desktop untuk HP.'))}

/* ---------- mulai ---------- */
ap();wall();rDesk();rStart();tbar();clock();tray();
setInterval(clock,15000);setInterval(tray,5000);setTimeout(load,300);
})();
</script>
